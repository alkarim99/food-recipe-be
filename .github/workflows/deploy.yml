name: Deploy food-recipe-be

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: dulcloud-recipe-be

    steps:
      - name: Pull latest code
        working-directory: /home/dul/services/food-recipe-be
        run: git pull origin main

      - name: Rebuild and restart container
        working-directory: /home/dul/services/food-recipe-be
        run: |
          docker compose down
          docker compose build --no-cache
          docker compose up -d

      - name: Verify container is running
        working-directory: /home/dul/services/food-recipe-be
        run: |
          sleep 5
          docker compose ps
